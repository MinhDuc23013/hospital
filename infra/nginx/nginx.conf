worker_processes auto;

events {
    worker_connections 2048;
}

http {
    # Use Docker internal DNS resolver
    resolver 127.0.0.11 valid=5s ipv6=off;

    # Upstream pools with dynamic resolution
    # Docker Compose DNS returns all replica IPs for service name
    upstream appointment_backend {
        least_conn;
        server hrm-workspace-appointment-service-1:5002;
        server hrm-workspace-appointment-service-2:5002;
    }

    upstream patient_backend {
        least_conn;
        server hrm-workspace-patient-service-1:5001;
        server hrm-workspace-patient-service-2:5001;
    }

    upstream doctor_backend {
        least_conn;
        server hrm-workspace-doctor-schedule-service-1:5007;
        server hrm-workspace-doctor-schedule-service-2:5007;
        server hrm-workspace-doctor-schedule-service-3:5007;
    }

    upstream payment_backend {
        least_conn;
        server hrm-workspace-payment-service-1:5008;
        server hrm-workspace-payment-service-2:5008;
        server hrm-workspace-payment-service-3:5008;
    }

    # Appointment Service LB
    server {
        listen 5002;
        location / {
            proxy_pass http://appointment_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }
    }

    # Patient Service LB
    server {
        listen 5001;
        location / {
            proxy_pass http://patient_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }
    }

    # Doctor Schedule Service LB
    server {
        listen 5007;
        location / {
            proxy_pass http://doctor_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }
    }

    # Payment Service LB
    server {
        listen 5008;
        location / {
            proxy_pass http://payment_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }
    }
}
