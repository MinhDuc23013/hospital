input {
  beats {
    port => 5044
  }

  tcp {
    port  => 5000
    codec => json_lines
  }

  # Serilog.Sinks.Http ArrayBatchFormatter sends a JSON array as the HTTP body
  http {
    port  => 8088
    codec => plain
  }
}

filter {
  # ── HTTP batch path ───────────────────────────────────────────────────────
  # Parse the JSON array body, split into individual events, promote fields.
  # After split the sub-events re-enter this filter from the top WITHOUT the
  # [headers] field (removed below), so CLEF mapping runs on them correctly.
  if [headers] {
    json {
      source       => "message"
      target       => "batch"
      remove_field => ["message", "headers", "host"]
    }
    split {
      field => "batch"
    }
    ruby {
      code => "
        ev = event.get('batch')
        if ev.is_a?(Hash)
          ev.each_pair { |k, v| event.set(k, v) }
        end
        event.remove('batch')
      "
    }
  }

  # ── CLEF compact field mapping (both HTTP path after split and direct sends) ──
  if [@t] {
    date {
      match        => ["@t", "ISO8601"]
      target       => "@timestamp"
      remove_field => ["@t"]
    }
  }
  if [@l] {
    mutate {
      add_field    => { "log_level" => "%{@l}" }
      remove_field => ["@l"]
    }
  }
  if [@mt] {
    mutate {
      rename => { "@mt" => "message_template" }
    }
  }
  if [@m] {
    mutate {
      rename => { "@m" => "message" }
    }
  }
  if [@x] {
    mutate {
      rename => { "@x" => "exception" }
    }
  }

  # ── Standard Serilog JSON (TCP / Beats path) ─────────────────────────────
  if [Timestamp] {
    date {
      match        => ["Timestamp", "ISO8601"]
      target       => "@timestamp"
      remove_field => ["Timestamp"]
    }
  }
  if [Level] and ![log_level] {
    mutate {
      add_field    => { "log_level" => "%{Level}" }
      remove_field => ["Level"]
    }
  }
  if [SourceContext] and ![service] {
    mutate {
      add_field => { "service" => "%{SourceContext}" }
    }
  }
}

output {
  elasticsearch {
    hosts       => ["http://elasticsearch:9200"]
    index       => "hospital-logs-%{+YYYY.MM.dd}"
    ilm_enabled => false
  }
}
