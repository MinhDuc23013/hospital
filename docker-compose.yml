networks:
  hospital-network:
    driver: bridge

volumes:
  pgdata:
  mongodata:
  sqldata:
  rabbitmqdata:
  esdata:
  redisdata:
  keycloakdata:
  keycloak-pgdata:
  seqdata:

services:
  # MailHog — dev SMTP server (captures emails, no real delivery)
  # UI at http://localhost:8025 to view emails sent by Keycloak etc.
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: hospital-mailhog
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"   # SMTP
      - "${MAILHOG_UI_PORT:-8025}:8025"     # Web UI
    restart: unless-stopped
    networks:
      - hospital-network

  postgres:
    image: postgres:15-alpine
    container_name: hospital-postgres
    command: postgres -c max_connections=200 -c shared_buffers=256MB
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hospital}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-hospital_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/scripts/init-databases.sh:/docker-entrypoint-initdb.d/init.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hospital} -d ${POSTGRES_DB:-hospital_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - hospital-network

  mongo:
    image: mongo:6-jammy
    container_name: hospital-mongo
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - hospital-network

  mongo-express:
    image: mongo-express:1.0.2
    container_name: hospital-mongo-express
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017
      ME_CONFIG_BASICAUTH: "false"
    ports:
      - "8081:8081"
    restart: unless-stopped
    networks:
      - hospital-network

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: hospital-sqlserver
    environment:
      ACCEPT_EULA: Y
      SA_PASSWORD: ${MSSQL_SA_PASSWORD:-YourStrong!Passw0rd}
      MSSQL_PID: Developer
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P ${MSSQL_SA_PASSWORD:-YourStrong!Passw0rd} -Q 'SELECT 1' -No -C"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - hospital-network

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: hospital-rabbitmq
    # Enable Prometheus plugin (port 15692) alongside management UI (15672).
    command: >
      sh -c "rabbitmq-plugins enable --offline rabbitmq_prometheus &&
             docker-entrypoint.sh rabbitmq-server"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
      - "15692:15692"
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - hospital-network

  redis:
    image: redis:7-alpine
    container_name: hospital-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - hospital-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: hospital-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    restart: unless-stopped
    networks:
      - hospital-network

  # Dedicated PostgreSQL for Keycloak — isolated from app data
  # Production: replace with managed RDS (encrypted at rest + TLS in transit)
  keycloak-db:
    image: postgres:15-alpine
    container_name: hospital-keycloak-db
    environment:
      POSTGRES_USER: ${KEYCLOAK_DB_USER:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_pw_change_me}
      POSTGRES_DB: keycloak
    ports:
      - "${KEYCLOAK_DB_PORT:-5434}:5432"
    volumes:
      - keycloak-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KEYCLOAK_DB_USER:-keycloak} -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - hospital-network

  keycloak:
    image: quay.io/keycloak/keycloak:22.0
    container_name: hospital-keycloak
    command: start-dev --import-realm --health-enabled=true
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_password_change_me}
      # PostgreSQL backend (production pattern — replace JDBC URL with RDS endpoint)
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_pw_change_me}
      # Performance tuning for PostgreSQL backend
      KC_DB_POOL_INITIAL_SIZE: 5
      KC_DB_POOL_MIN_SIZE: 5
      KC_DB_POOL_MAX_SIZE: 20
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - ./infra/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 2>/dev/null && echo -e 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 90s
    restart: unless-stopped
    networks:
      - hospital-network

  loki:
    image: grafana/loki:2.9.0
    container_name: hospital-loki
    ports:
      - "${LOKI_PORT:-3100}:3100"
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - hospital-network

  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: hospital-prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - hospital-network

  grafana:
    image: grafana/grafana:10.1.0
    container_name: hospital-grafana
    depends_on:
      - prometheus
      - loki
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_SMTP_ENABLED: 'true'
      GF_SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}:${SMTP_PORT:-587}
      GF_SMTP_USER: ${SMTP_USER:-}
      GF_SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      GF_SMTP_FROM_ADDRESS: ${EMAIL_FROM:-noreply@hospital.local}
      GF_SMTP_FROM_NAME: Hospital HRM Alert
      GF_SMTP_STARTTLS_POLICY: MandatoryStartTLS
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - hospital-network

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: hospital-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:16686"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - hospital-network

  seq:
    image: datalust/seq:2023.4
    container_name: hospital-seq
    environment:
      ACCEPT_EULA: Y
    ports:
      - "${SEQ_PORT:-5341}:80"
    volumes:
      - seqdata:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - hospital-network

  kafka:
    image: apache/kafka:3.7.0
    container_name: hospital-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: hospital-kafka-cluster-001
    ports:
      - "9092:9094"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - hospital-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: hospital-kafka-ui
    environment:
      - KAFKA_CLUSTERS_0_NAME=hospital
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
    ports:
      - "${KAFKA_UI_PORT:-9080}:8080"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - hospital-network

  # Exports Kafka consumer-group lag + broker metrics to Prometheus (scraped on :9308/metrics).
  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    container_name: hospital-kafka-exporter
    command:
      - '--kafka.server=kafka:9092'
      - '--web.listen-address=:9308'
    ports:
      - "9308:9308"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - hospital-network

  # ── Application Services ──────────────────────────────────────────────────

  hospital-gateway:
    build:
      context: .
      dockerfile: gateway/HospitalGateway/Dockerfile
    container_name: hospital-gateway
    ports:
      - "${GATEWAY_PORT:-5084}:5084"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5084
      - Keycloak__Authority=http://keycloak:8080/realms/hospital
      - Keycloak__Audience=hospital-gateway
      - Keycloak__AdminUrl=http://keycloak:8080
      - Keycloak__AdminUser=${KEYCLOAK_ADMIN:-admin}
      - Keycloak__AdminPassword=${KEYCLOAK_ADMIN_PASSWORD:-admin_password_change_me}
      - Redis__ConnectionString=redis:6379
      - Seq__Url=http://seq:5341
      - Loki__Url=http://loki:3100
      - Jaeger__Endpoint=http://jaeger:4317
    depends_on:
      keycloak:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5084 2>/dev/null && echo -e 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - hospital-network

  patient-service:
    build:
      context: .
      dockerfile: services/PatientService/Dockerfile
    container_name: patient-service
    ports:
      - "5001:5001"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5001

      - ConnectionStrings__PostgreSQL=Host=postgres;Database=${POSTGRES_DB:-hospital_db};Username=${POSTGRES_USER:-hospital};Password=${POSTGRES_PASSWORD:-dev_password_change_me}
      - Kafka__BootstrapServers=kafka:9092
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__User=${RABBITMQ_USER:-guest}
      - RabbitMQ__Password=${RABBITMQ_PASSWORD:-guest}
      - Services__AuthService=http://auth-service:5009
      - Keycloak__Authority=http://keycloak:8080/realms/hospital
      - Seq__Url=http://seq:5341
      - Loki__Url=http://loki:3100
      - Jaeger__Endpoint=http://jaeger:4317
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5001 2>/dev/null && echo -e 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - hospital-network

  appointment-service:
    build:
      context: .
      dockerfile: services/AppointmentService/Dockerfile
    deploy:
      replicas: 2
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5002
      - ConnectionStrings__PostgreSQL=Host=postgres;Database=${POSTGRES_DB:-hospital_db};Username=${POSTGRES_USER:-hospital};Password=${POSTGRES_PASSWORD:-dev_password_change_me}

      - Kafka__BootstrapServers=kafka:9092
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__User=${RABBITMQ_USER:-guest}
      - RabbitMQ__Password=${RABBITMQ_PASSWORD:-guest}
      - Services__PatientService=http://patient-service:5001
      - Services__DoctorScheduleService=http://doctor-schedule-service:5007
      - Services__PaymentService=http://payment-service:5008
      - Keycloak__Authority=http://keycloak:8080/realms/hospital
      - Seq__Url=http://seq:5341
      - Loki__Url=http://loki:3100
      - Jaeger__Endpoint=http://jaeger:4317
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      patient-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5002 2>/dev/null && echo -e 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - hospital-network

  orchestrator-service:
    build:
      context: .
      dockerfile: services/OrchestratorService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5010
      - ConnectionStrings__PostgreSQL=Host=postgres;Database=${POSTGRES_DB:-hospital_db};Username=${POSTGRES_USER:-hospital};Password=${POSTGRES_PASSWORD:-dev_password_change_me}
      - Kafka__BootstrapServers=kafka:9092
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__User=${RABBITMQ_USER:-guest}
      - RabbitMQ__Password=${RABBITMQ_PASSWORD:-guest}
      - Services__PatientService=http://patient-service:5001
      - Services__AppointmentService=http://appointment-service:5002
      - Services__DoctorScheduleService=http://doctor-schedule-service:5007
      - Services__PaymentService=http://payment-service:5008
      - Keycloak__Authority=http://keycloak:8080/realms/hospital
      - Seq__Url=http://seq:5341
      - Loki__Url=http://loki:3100
      - Jaeger__Endpoint=http://jaeger:4317
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_healthy
      appointment-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5010 2>/dev/null && echo -e 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - hospital-network

  medical-record-service:
    build:
      context: .
      dockerfile: services/MedicalRecordServiceDotnet/Dockerfile
    container_name: medical-record-service
    ports:
      - "5003:5003"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5003
      - MongoDB__ConnectionString=${MONGODB_URI:-mongodb://mongo:27017}
      - MongoDB__DatabaseName=hospital
      - Kafka__BootstrapServers=kafka:9092
      - Keycloak__Authority=http://keycloak:8080/realms/hospital
      - Seq__Url=http://seq:5341
      - Loki__Url=http://loki:3100
      - Jaeger__Endpoint=http://jaeger:4317
    depends_on:
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5003 2>/dev/null && echo -e 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - hospital-network

  pharmacy-service:
    build:
      context: .
      dockerfile: services/PharmacyServiceDotnet/Dockerfile
    container_name: pharmacy-service
    ports:
      - "5004:5004"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5004
      - ConnectionStrings__PostgreSQL=Host=postgres;Database=${POSTGRES_DB:-hospital_db};Username=${POSTGRES_USER:-hospital};Password=${POSTGRES_PASSWORD:-dev_password_change_me}
      - Kafka__BootstrapServers=kafka:9092
      - Keycloak__Authority=http://keycloak:8080/realms/hospital
      - Seq__Url=http://seq:5341
      - Loki__Url=http://loki:3100
      - Jaeger__Endpoint=http://jaeger:4317
      - Services__PaymentService=http://payment-service:5008
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5004 2>/dev/null && echo -e 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - hospital-network

  notification-service:
    build:
      context: .
      dockerfile: services/NotificationServiceDotnet/Dockerfile
    container_name: notification-service
    ports:
      - "5005:5005"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5005
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__User=${RABBITMQ_USER:-guest}
      - RabbitMQ__Password=${RABBITMQ_PASSWORD:-guest}
      - Smtp__Host=${SMTP_HOST:-}
      - Smtp__Port=${SMTP_PORT:-587}
      - Smtp__User=${SMTP_USER:-}
      - Smtp__Password=${SMTP_PASSWORD:-}
      - Smtp__From=${EMAIL_FROM:-noreply@hospital.local}
      - Keycloak__Authority=http://keycloak:8080/realms/hospital
      - Seq__Url=http://seq:5341
      - Loki__Url=http://loki:3100
      - Jaeger__Endpoint=http://jaeger:4317
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5005 2>/dev/null && echo -e 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - hospital-network

  auth-service:
    build:
      context: .
      dockerfile: services/AuthServiceDotnet/Dockerfile
    container_name: auth-service
    ports:
      - "5009:5009"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5009
      - Keycloak__AdminUrl=http://keycloak:8080
      - Keycloak__Realm=hospital
      - Keycloak__AdminUser=${KEYCLOAK_ADMIN:-admin}
      - Keycloak__AdminPassword=${KEYCLOAK_ADMIN_PASSWORD:-admin_password_change_me}
      - Keycloak__Authority=http://keycloak:8080/realms/hospital
      - Seq__Url=http://seq:5341
      - Loki__Url=http://loki:3100
      - Jaeger__Endpoint=http://jaeger:4317
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5009 2>/dev/null && echo -e 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - hospital-network

  search-service:
    build:
      context: .
      dockerfile: services/SearchServiceDotnet/Dockerfile
    container_name: search-service
    ports:
      - "5006:5006"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5006
      - Elasticsearch__Uri=http://elasticsearch:9200
      - Kafka__BootstrapServers=kafka:9092
      - Keycloak__Authority=http://keycloak:8080/realms/hospital
      - Seq__Url=http://seq:5341
      - Loki__Url=http://loki:3100
      - Jaeger__Endpoint=http://jaeger:4317
      - Services__PatientService=http://patient-service:5001
      - Services__AppointmentService=http://appointment-service:5002
      - Services__DoctorScheduleService=http://doctor-schedule-service:5007
      - Services__PaymentService=http://payment-service:5008
    depends_on:
      elasticsearch:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5006 2>/dev/null && echo -e 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - hospital-network

  doctor-schedule-service:
    build:
      context: .
      dockerfile: services/DoctorScheduleService/Dockerfile
    container_name: doctor-schedule-service
    ports:
      - "5007:5007"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5007

      - ConnectionStrings__PostgreSQL=Host=postgres;Database=${POSTGRES_DB:-hospital_db};Username=${POSTGRES_USER:-hospital};Password=${POSTGRES_PASSWORD:-dev_password_change_me}
      - Kafka__BootstrapServers=kafka:9092
      - Services__AuthService=http://auth-service:5009
      - Elasticsearch__Uri=http://elasticsearch:9200
      - Keycloak__Authority=http://keycloak:8080/realms/hospital
      - Seq__Url=http://seq:5341
      - Loki__Url=http://loki:3100
      - Jaeger__Endpoint=http://jaeger:4317
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5007 2>/dev/null && echo -e 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - hospital-network

  payment-service:
    build:
      context: .
      dockerfile: services/PaymentService/Dockerfile
    container_name: payment-service
    ports:
      - "5008:5008"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5008

      - ConnectionStrings__PostgreSQL=Host=postgres;Database=${POSTGRES_DB:-hospital_db};Username=${POSTGRES_USER:-hospital};Password=${POSTGRES_PASSWORD:-dev_password_change_me}
      - Kafka__BootstrapServers=kafka:9092
      - Services__AppointmentService=http://appointment-service:5002
      - Keycloak__Authority=http://keycloak:8080/realms/hospital
      - Seq__Url=http://seq:5341
      - Loki__Url=http://loki:3100
      - Jaeger__Endpoint=http://jaeger:4317
    depends_on:
      postgres:
        condition: service_healthy
      appointment-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5008 2>/dev/null && echo -e 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - hospital-network

  # ── Client Applications ────────────────────────────────────────────────────

  patient-client:
    build:
      context: ./client/patient-app
      dockerfile: Dockerfile
    container_name: patient-client
    ports:
      - "3100:3100"
    environment:
      # Public URL the browser uses to reach this app — must match Keycloak's
      # Valid Redirect URIs exactly. Set via .env file, never hardcode a default.
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      # No fallback — missing secret causes immediate startup failure
      # (safer than silently running with a known-insecure value)
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required}
      - KEYCLOAK_CLIENT_ID=hospital-patient-portal
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET}
      # Keycloak internal Docker hostname for server-side token validation
      - KEYCLOAK_ISSUER=http://keycloak:8080/realms/hospital
      # Server-only — no NEXT_PUBLIC_ prefix; never expose gateway URL to client bundle
      - GATEWAY_API_URL=http://hospital-gateway:8000
    depends_on:
      hospital-gateway:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3100 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - hospital-network

  doctor-app:
    build:
      context: .
      dockerfile: client/doctor-app/Dockerfile
    container_name: doctor-app
    ports:
      - "${DOCTOR_APP_PORT:-3200}:3200"
    environment:
      - NEXTAUTH_URL=http://localhost:3200
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-changeme}
      - KEYCLOAK_CLIENT_ID=doctor-app
      - KEYCLOAK_CLIENT_SECRET=${DOCTOR_APP_KEYCLOAK_SECRET:-}
      - KEYCLOAK_ISSUER=http://keycloak:8080/realms/hospital
      - GATEWAY_API_URL=http://hospital-gateway:8000
    depends_on:
      hospital-gateway:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3200 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - hospital-network

  hrm-frontend:
    build:
      context: ./front-end
      dockerfile: Dockerfile
    container_name: hrm-frontend
    ports:
      - "${HRM_FRONTEND_PORT:-3400}:80"
    depends_on:
      hospital-gateway:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:80 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - hospital-network
